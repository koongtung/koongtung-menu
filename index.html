<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koong Tung Menu</title>
<meta name="description" content="Koong Tung digital menu - seafood boil restaurant">
<meta name="theme-color" content="#d2202c">
<link rel="icon" href="assets/img/brand/logo.jpg">
<link rel="apple-touch-icon" href="assets/img/brand/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#menu-content">Skip to menu</a>

<header class="site-header">
  <div class="site-header__top">
    <img class="site-header__logo" src="assets/img/brand/logo.jpg" alt="Koong Tung logo">
    <div class="site-header__brand">
      <h1 id="brand-name">Koong Tung</h1>
      <p id="brand-tagline"></p>
    </div>
    <div class="lang-switch" id="lang-switch"></div>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <input type="search" id="search-input" aria-label="Search menu">
    <span class="icon">🔍</span>
  </div>
  <div class="filter-row">
    <button class="filter-toggle" id="filter-toggle">
      <span>⚙️</span><span id="filter-toggle-label">Filters</span>
    </button>
  </div>
</div>

<div class="advanced-filters" id="advanced-filters">
  <div class="filter-group">
    <h3 id="price-range-title">Price Range</h3>
    <div class="price-range">
      <input type="number" id="min-price" min="0" style="flex:1;min-width:100px;padding:8px 10px;border-radius:8px;border:1.5px solid #f0e6cc;">
      <input type="number" id="max-price" min="0" style="flex:1;min-width:100px;padding:8px 10px;border-radius:8px;border:1.5px solid #f0e6cc;">
    </div>
  </div>
  <div class="filter-group">
    <h3 id="tags-title">Tags</h3>
    <div class="tag-filters" id="tag-filters"></div>
  </div>
  <button class="clear-filters" id="clear-filters-btn">Clear filters</button>
</div>

<nav class="category-nav" id="category-nav" aria-label="Categories"></nav>

<main id="menu-content"></main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <h3 id="footer-contact-title">Contact</h3>
    <div class="site-footer__contact">
      <a id="footer-phone" href="#"></a>
      <span id="footer-fb"></span>
      <span id="footer-line"></span>
    </div>
    <h3 id="footer-branches-title" style="margin-top:18px;">Branches</h3>
    <ul id="footer-branches"></ul>
    <p class="site-footer__note">© Koong Tung · Digital menu for viewing only, no online ordering.</p>
  </div>
</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div id="modal-inner"></div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "cbba37afc1ef4ad3acd4c3371fe484f3"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
