<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koong Tung – QR Code สำหรับโต๊ะ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#d2202c; --secondary:#1b3a6b; --cream:#faf3e3; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #ece3cf; font-family: "Noto Sans Thai", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 12px 60px;
  }
  .toolbar {
    max-width: 500px; width: 100%; margin-bottom: 20px; background: #fff; border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,.1); font-size: 0.85rem;
  }
  .toolbar label { display:block; margin-bottom:6px; font-weight:600; color:var(--secondary); }
  .toolbar input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1.5px solid #e6dcc0; font-size: 0.85rem;
  }
  .toolbar button {
    margin-top: 10px; background: var(--secondary); color: #fff; border: none; padding: 9px 16px;
    border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .card {
    width: 100%; max-width: 500px; background: var(--cream); border: 6px solid var(--primary);
    border-radius: 22px; padding: 32px 24px 26px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  }
  .card h1 { color: var(--primary); font-size: 1.6rem; margin: 0 0 2px; }
  .card .sub { color: var(--secondary); font-size: 0.95rem; margin-bottom: 20px; font-weight: 600; }
  #qrcode { display: flex; justify-content: center; margin: 0 auto 18px; }
  #qrcode img, #qrcode canvas { border-radius: 10px; border: 8px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .card .cta { font-size: 1.05rem; font-weight: 800; color: var(--secondary); margin-bottom: 4px; }
  .card .url { font-size: 0.78rem; color: #6b6155; word-break: break-all; }
  .print-btn {
    margin-top: 22px; background: var(--primary); color: #fff; border: none; padding: 11px 22px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 0.9rem;
  }
  @media print {
    .toolbar, .print-btn { display: none; }
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <label for="site-url">ลิงก์เว็บเมนู (URL หลังจาก deploy แล้ว)</label>
    <input type="url" id="site-url" placeholder="https://koongtung.github.io/koongtung-menu/">
    <button onclick="generate()">สร้าง QR ใหม่</button>
  </div>

  <div class="card">
    <h1>Koong Tung</h1>
    <div class="sub">First Seafood Boil in Thailand · Since 2015</div>
    <div id="qrcode"></div>
    <div class="cta">📱 สแกนเพื่อดูเมนู / Scan for Menu / 扫码看菜单</div>
    <div class="url" id="url-display"></div>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ พิมพ์สำหรับวางโต๊ะ / Print</button>
  <a class="print-btn" style="background:var(--secondary);text-decoration:none;display:inline-block;" href="assets/img/brand/qr-code.gif" download="koongtung-menu-qr.gif">⬇️ ดาวน์โหลดไฟล์ QR / Download</a>

<script src="assets/js/qrcode.js"></script>
<script>
  function generate() {
    var url = document.getElementById('site-url').value.trim();
    if (!url) {
      url = window.location.origin + window.location.pathname.replace(/qr\.html$/, 'index.html');
    }
    localStorage.setItem('kt-site-url', url);
    document.getElementById('url-display').textContent = url;
    var target = document.getElementById('qrcode');
    target.innerHTML = '';
    var qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    target.innerHTML = qr.createImgTag(6, 8);
  }

  document.getElementById('site-url').value = localStorage.getItem('kt-site-url') || '';
  generate();
</script>

<!-- End Cloudflare Web Analytics -->
</body>
</html>
